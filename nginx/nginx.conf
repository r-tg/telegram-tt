# 此文件通过 conf.d/*.conf 被包含进 http {} 上下文，
# 因此 http 级指令（gzip、limit_*_zone）可写在 server 块之外。

# 隐藏 nginx 版本号，避免暴露攻击面
server_tokens off;

# Gzip 压缩，减小传输体积
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml;

# 限流区域：按客户端 IP 统计，用于缓解 CC/DoS 攻击
# req_limit：请求速率；conn_limit：并发连接数
limit_req_zone  $binary_remote_addr zone=req_limit:10m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html index.htm;

    # 限制请求体大小，防止超大请求耗尽资源（本服务仅托管静态前端）
    client_max_body_size 16m;
    # 收紧读取超时，缓解 Slowloris 类慢速攻击
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    keepalive_timeout     30s;

    # 安全响应头（always 确保错误响应也带上）
    add_header X-Frame-Options        "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header X-XSS-Protection       "0"                                 always;  # 禁用有缺陷的旧版过滤器，改由 CSP/框架防护
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy     "geolocation=(self), microphone=(self), camera=(self)" always;
    # 在 HTTPS 终止（反向代理/负载均衡）后再启用 HSTS，否则纯 HTTP 访问会被锁定：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP 需按实际加载的 worker/wasm/Telegram 接口调整，启用前务必充分测试，否则会白屏：
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # 拒绝访问隐藏文件（.git、.env 等），放行 ACME 校验目录
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        # 每 IP 限流与并发限制；burst 放宽以容纳首屏并发加载的大量分片
        limit_req  zone=req_limit burst=100 nodelay;
        limit_conn conn_limit 20;
        # 静态站点只需读方法，拦截其余方法
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        try_files $uri $uri/ /index.html;  # 支持 SPA 前端路由
    }

    # 带内容哈希的静态资源，长期缓存；仅用 expires 以继承上面的安全响应头
    location /assets {
        expires    7d;
        access_log off;
    }

    # 将服务端错误页重定向到静态页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        internal;
    }
}
